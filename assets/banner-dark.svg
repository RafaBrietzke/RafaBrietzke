<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Rafaela Brietzke · Desenvolvedora full stack</title>
  <desc id="desc">Desenvolvedora full stack que também define o que construir. Uma planta baixa se desenha e vira a interface de um sistema.</desc>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="rgba(157,176,200,0.08)" stroke-width="1"/></pattern>
    <pattern id="G" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="rgba(157,176,200,0.15)" stroke-width="1"/></pattern>
    <clipPath id="c0"><rect class="t0" x="-305" y="290" width="409" height="36"/></clipPath><clipPath id="c1"><rect class="t1" x="-358" y="290" width="462" height="36"/></clipPath><clipPath id="c2"><rect class="t2" x="-160" y="290" width="264" height="36"/></clipPath>
  </defs>
  <style>
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 2.6s .3s cubic-bezier(.6,0,.3,1) forwards; }
    .draw.d2 { animation-delay: 1.1s; }
    .draw.d3 { animation-delay: 1.6s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .door { opacity: 0; animation: fade .6s 2.6s forwards, out .5s 4.4s forwards; }
    @keyframes out { from { opacity: 1; } to { opacity: 0; } }
    .ui { opacity: 0; animation: fade .7s forwards; }
    .ui1 { animation-delay: 3.4s; } .ui2 { animation-delay: 3.8s; } .ui3 { animation-delay: 4.2s; } .ui4 { animation-delay: 4.6s; }
    @keyframes fade { to { opacity: 1; } }
    .dim { opacity: 0; animation: fade .6s .2s forwards; }
    
    @keyframes type0 {
      0% { transform: translateX(0); animation-timing-function: steps(31, end); }
      11.67% { transform: translateX(409px); }
      30.00% { transform: translateX(409px); animation-timing-function: steps(16, end); }
      33.33%, 100% { transform: translateX(0); }
    }
    @keyframes vis0 {
      0% { opacity: 1; }
      
      33.33%, 100% { opacity: 0; }
    }
    .t0 { animation: type0 15s infinite; }
    .cursor.t0 { animation: type0 15s infinite, vis0 15s steps(1, end) infinite; }
    @keyframes type1 {
      0%, 33.33% { transform: translateX(0); animation-timing-function: steps(35, end); }
      45.00% { transform: translateX(462px); }
      63.33% { transform: translateX(462px); animation-timing-function: steps(18, end); }
      66.67%, 100% { transform: translateX(0); }
    }
    @keyframes vis1 {
      0% { opacity: 0; }
      33.33% { opacity: 1; }
      66.67%, 100% { opacity: 0; }
    }
    .t1 { animation: type1 15s infinite; }
    .cursor.t1 { animation: type1 15s infinite, vis1 15s steps(1, end) infinite; }
    @keyframes type2 {
      0%, 66.67% { transform: translateX(0); animation-timing-function: steps(20, end); }
      78.33% { transform: translateX(264px); }
      96.67% { transform: translateX(264px); animation-timing-function: steps(10, end); }
      100.00%, 100% { transform: translateX(0); }
    }
    @keyframes vis2 {
      0% { opacity: 0; }
      66.67% { opacity: 1; }
      100.00%, 100% { opacity: 0; }
    }
    .t2 { animation: type2 15s infinite; }
    .cursor.t2 { animation: type2 15s infinite, vis2 15s steps(1, end) infinite; }
    @media (prefers-reduced-motion: reduce) {
      *, .cursor { animation: none !important; }
      .draw { stroke-dashoffset: 0; }
      .door { opacity: 0; }
      .ui, .dim { opacity: 1; }
      .t0 { transform: translateX(409px); }
      .t1, .t2, .cursor.t1, .cursor.t2 { opacity: 0; }
    }
  </style>

  <rect width="1200" height="400" fill="#0f1b2d"/>
  <rect width="1200" height="400" fill="url(#g)"/>
  <rect width="1200" height="400" fill="url(#G)"/>

  <!-- texto -->
  <text x="72" y="92" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#f2b544">PORTFÓLIO · FOLHA 01</text>
  <text x="70" y="166" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="70" fill="#e8eef6">Rafaela Brietzke</text>
  <text x="72" y="216" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#9db0c8">Desenvolvedora full stack que também define</text>
  <text x="72" y="254" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-style="italic" font-size="34" fill="#f2b544">o que construir.</text>
  <text x="72" y="316" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#f2b544">$</text>
  
    <g clip-path="url(#c0)"><text x="104" y="316" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#e8eef6" textLength="409" lengthAdjust="spacingAndGlyphs">spec → código → testes → deploy</text></g>
    <rect class="t0 cursor" x="106" y="298" width="11" height="24" fill="#f2b544"/>
    <g clip-path="url(#c1)"><text x="104" y="316" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#e8eef6" textLength="462" lengthAdjust="spacingAndGlyphs">React · Node.js · TypeScript · Java</text></g>
    <rect class="t1 cursor" x="106" y="298" width="11" height="24" fill="#f2b544"/>
    <g clip-path="url(#c2)"><text x="104" y="316" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#e8eef6" textLength="264" lengthAdjust="spacingAndGlyphs">da planta ao produto</text></g>
    <rect class="t2 cursor" x="106" y="298" width="11" height="24" fill="#f2b544"/>
  <text x="72" y="364" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1" fill="#9db0c8">PORTO ALEGRE, RS · REMOTO OU HÍBRIDO</text>

  <!-- cota -->
  <g class="dim" stroke="#9db0c8" stroke-width="1">
    <path d="M770 66h360 M770 59v14 M1130 59v14"/>
  </g>
  <text class="dim" x="950" y="58" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#9db0c8">PLANTA → PRODUTO</text>

  <!-- interface (entra depois da planta) -->
  <rect class="ui ui1" x="770" y="92" width="360" height="26" fill="rgba(242,181,68,0.14)"/>
  <g class="ui ui1" fill="#f2b544"><circle cx="784" cy="105" r="4"/><circle cx="798" cy="105" r="4"/><circle cx="812" cy="105" r="4"/></g>
  <g class="ui ui2" fill="#2a3d5c">
    <rect x="786" y="136" width="80" height="10" rx="2"/>
    <rect x="786" y="158" width="64" height="10" rx="2"/>
    <rect x="786" y="180" width="72" height="10" rx="2"/>
    <rect x="786" y="202" width="56" height="10" rx="2"/>
  </g>
  <g class="ui ui3">
    <rect x="898" y="134" width="98" height="62" fill="rgba(242,181,68,0.14)"/>
    <rect x="1008" y="134" width="106" height="62" fill="rgba(242,181,68,0.14)"/>
    <rect x="910" y="148" width="40" height="8" fill="#f2b544"/>
    <rect x="1020" y="148" width="52" height="8" fill="#f2b544"/>
  </g>
  <g class="ui ui4" fill="#2a3d5c">
    <rect x="898" y="232" width="216" height="10" rx="2"/>
    <rect x="898" y="254" width="216" height="10" rx="2"/>
    <rect x="898" y="276" width="160" height="10" rx="2"/>
    <rect x="898" y="298" width="190" height="10" rx="2"/>
  </g>

  <!-- planta -->
  <g fill="none" stroke="#f2b544" stroke-width="3" stroke-linecap="square">
    <path class="draw" d="M770 92h360v236h-360z"/>
    <path class="draw d2" d="M882 92v236"/>
    <path class="draw d3" d="M882 212h110 m40 0h98"/>
  </g>
  <path class="door" d="M992 212 a40 40 0 0 1 40 40 M992 212v40" fill="none" stroke="#f2b544" stroke-width="1.5"/>
</svg>
